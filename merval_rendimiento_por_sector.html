<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merval por sector</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--ink:#141413;--ink2:#5e5d59;--muted:#9a9893;--line:#e8e6e0;--seg:#ecebe6;--neg:#c2413b;--pos:#1f7a4d}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1b1b1a;--ink:#f0efec;--ink2:#bdbcb4;--muted:#7d7c77;--line:#2b2b29;--seg:#242422;--neg:#e5706b;--pos:#4cc38a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
main{max-width:900px;margin:0 auto;padding:40px 24px 56px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:32px;margin:0;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--seg);border-radius:10px;padding:3px}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink2);padding:6px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.kpi{padding:16px 20px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:Georgia,serif;font-size:clamp(22px,4.2vw,32px);line-height:1.1;margin-top:6px}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 12px;margin-top:12px}
.ct{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.ct h2{font-size:14px;font-weight:500;margin:0}
.lg{display:flex;flex-wrap:wrap;gap:6px}
.lg span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:4px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;user-select:none}
.lg i{width:8px;height:8px;border-radius:50%}
.lg span.off{opacity:.35}
footer{font-size:11px;color:var(--muted);margin-top:16px}
@media (max-width:640px){.kpi{padding:12px 14px}h1{font-size:26px}}
</style>
</head>
<body>
<main>
<header>
  <div><div class="eyebrow">S&amp;P Merval · variación en USD</div><h1>Rendimiento por sector</h1></div>
  <div class="seg" id="periods"></div>
</header>
<div class="kpis">
  <div class="kpi"><div class="l">Merval</div><div class="v" id="k1"></div><div class="s">Índice</div></div>
  <div class="kpi"><div class="l">Mejor sector</div><div class="v" id="k2"></div><div class="s" id="k2s"></div></div>
  <div class="kpi"><div class="l">Peor sector</div><div class="v" id="k3"></div><div class="s" id="k3s"></div></div>
</div>
<div class="card">
  <div class="ct"><h2>Sectores vs. Merval</h2></div>
  <div style="position:relative;height:250px"><canvas id="c1" role="img" aria-label="Variación promedio por sector y del Merval"></canvas></div>
</div>
<div class="card">
  <div class="ct"><h2>Empresas</h2><div class="lg" id="lg"></div></div>
  <div style="position:relative;height:600px" id="w2"><canvas id="c2" role="img" aria-label="Variación por empresa, coloreada por sector"></canvas></div>
</div>
<footer>Promedio simple por sector · Línea punteada: Merval · Sectores: IAMC</footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const P=['1D','1S','1M','3M','YTD','12M'];
const merval=[1.3,-6.3,-26.8,-30.3,-31.3,-26.1];
const S={
 'Financieros':{c:'#2f6fd1',t:{BBAR:[4.6,-7.7,-30.2,-37.7,-49.0,-34.5],GGAL:[1.7,-10.0,-32.1,-40.7,-52.2,-44.6],BMA:[1.5,-7.0,-23.1,-33.9,-43.2,-31.7],SUPV:[2.8,-15.7,-39.9,-45.6,-60.7,-52.1],BYMA:[-4.6,-5.7,-28.0,-35.4,-44.4,-42.2],VALO:[2.3,-5.4,-7.3,-18.7,-19.2,-4.5]}},
 'Energía':{c:'#e0662f',t:{YPFD:[-1.1,-11.8,-36.7,-37.2,-10.7,-10.8],TGSU2:[1.7,-4.2,-27.6,-30.6,-35.6,-33.7],TGNO4:[5.7,1.9,-22.5,-34.0,-55.2,-50.7]}},
 'Servicios públicos':{c:'#1a9a6c',t:{PAMP:[1.4,-1.5,-22.8,-23.6,-28.9,-28.4],CEPU:[5.3,-1.5,-15.2,-23.2,-40.4,-26.9],TRAN:[1.8,6.4,-22.5,-44.0,-50.4,-48.2],EDN:[1.1,-10.8,-38.1,-49.6,-61.8,-60.9],METR:[-5.5,-19.4,-33.8,-30.4,-41.8,-35.0],ECOG:[1.7,-0.5,-20.6,-39.6,-47.1,-50.0]}},
 'Materiales':{c:'#6a55d8',t:{TXAR:[0.2,-3.2,-16.9,-9.4,-11.4,-25.8],ALUA:[-0.7,-0.8,-13.2,-14.6,-28.5,-30.6],LOMA:[3.5,0.5,-16.3,-15.2,-36.0,-26.6]}},
 'Consumo básico':{c:'#d99a00',t:{CRES:[1.8,-11.3,-28.7,-28.6,-36.6,-28.3]}}
};
let pi=4;const hidden=new Set();
const cs=getComputedStyle(document.documentElement),V=k=>cs.getPropertyValue(k).trim();
const ink=V('--ink2'),line=V('--line'),muted=V('--muted'),neg=V('--neg'),pos=V('--pos');
Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;
const f=v=>(v>0?'+':'')+v.toFixed(1).replace('.',',')+'%';
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const ref={id:'ref',afterDatasetsDraw(ch){const x=ch.scales.x.getPixelForValue(merval[pi]);const{top,bottom}=ch.chartArea;const g=ch.ctx;g.save();g.setLineDash([3,4]);g.strokeStyle=muted;g.beginPath();g.moveTo(x,top-6);g.lineTo(x,bottom);g.stroke();g.setLineDash([]);g.fillStyle=muted;g.font='10px '+Chart.defaults.font.family;g.textAlign='center';g.fillText('Merval',x,top-10);g.restore();}};
const lbl={id:'lbl',afterDatasetsDraw(ch){const g=ch.ctx;g.save();g.font='500 11px '+Chart.defaults.font.family;g.textBaseline='middle';ch.getDatasetMeta(0).data.forEach((b,i)=>{const v=ch.data.datasets[0].data[i];g.fillStyle=ink;g.textAlign=v<0?'right':'left';g.fillText(f(v),b.x+(v<0?-6:6),b.y);});g.restore();}};
const opts=(pad)=>({indexAxis:'y',responsive:true,maintainAspectRatio:false,animation:{duration:350},layout:{padding:{left:44,right:44,top:pad}},
 plugins:{legend:{display:false},tooltip:{backgroundColor:'#141413',padding:10,cornerRadius:8,displayColors:false,callbacks:{label:c=>f(c.raw)}}},
 scales:{x:{grid:{color:line,drawTicks:false},border:{display:false},ticks:{color:muted,padding:8,font:{size:11},callback:v=>v+'%'}},y:{grid:{display:false},border:{display:false},ticks:{color:ink,autoSkip:false,font:{size:12}}}}});
const c1=new Chart(document.getElementById('c1'),{type:'bar',data:{labels:[],datasets:[{data:[],backgroundColor:[],borderRadius:6,borderSkipped:false,maxBarThickness:22}]},options:opts(0),plugins:[lbl]});
const o2=opts(26);o2.plugins.tooltip.callbacks.label=c=>f(c.raw)+' · '+c2._sec[c.dataIndex];
const c2=new Chart(document.getElementById('c2'),{type:'bar',data:{labels:[],datasets:[{data:[],backgroundColor:[],borderRadius:5,borderSkipped:false,maxBarThickness:16}]},options:o2,plugins:[lbl,ref]});
const col=v=>v<0?neg:pos;
function draw(){
 const secs=Object.entries(S).map(([n,s])=>({n,c:s.c,v:avg(Object.values(s.t).map(a=>a[pi]))})).sort((a,b)=>b.v-a.v);
 const rows=[...secs,{n:'Merval',c:muted,v:merval[pi]}].sort((a,b)=>b.v-a.v);
 c1.data.labels=rows.map(r=>r.n);c1.data.datasets[0].data=rows.map(r=>r.v);c1.data.datasets[0].backgroundColor=rows.map(r=>r.c);c1.update();
 const k=(id,v)=>{const e=document.getElementById(id);e.textContent=f(v);e.style.color=col(v);};
 k('k1',merval[pi]);k('k2',secs[0].v);k('k3',secs.at(-1).v);
 document.getElementById('k2s').textContent=secs[0].n;document.getElementById('k3s').textContent=secs.at(-1).n;
 const L=[],D=[],C=[],SE=[];
 secs.forEach(s=>{if(hidden.has(s.n))return;Object.entries(S[s.n].t).sort((a,b)=>b[1][pi]-a[1][pi]).forEach(([k,a])=>{L.push(k);D.push(a[pi]);C.push(s.c);SE.push(s.n);});});
 c2._sec=SE;c2.data.labels=L;c2.data.datasets[0].data=D;c2.data.datasets[0].backgroundColor=C;
 document.getElementById('w2').style.height=(L.length*27+70)+'px';c2.resize();c2.update();
 document.querySelectorAll('#periods button').forEach((b,i)=>b.classList.toggle('on',i===pi));
}
P.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p;b.onclick=()=>{pi=i;draw();};document.getElementById('periods').appendChild(b);});
Object.entries(S).forEach(([n,s])=>{const e=document.createElement('span');e.innerHTML='<i style="background:'+s.c+'"></i>'+n;e.onclick=()=>{hidden.has(n)?hidden.delete(n):hidden.add(n);e.classList.toggle('off');draw();};document.getElementById('lg').appendChild(e);});
draw();
</script>
</body>
</html>
