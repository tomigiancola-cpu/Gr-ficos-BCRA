<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merval y riesgo país en la semana</title>
<style>
.viz{--bg:#fff;--ink:#121212;--ink2:#4a4a4a;--ink3:#8c8c8c;--rule:#121212;--grid:#e6e6e6;--base:#9a9a9a;
 --s1:#1f3a5f;--s2:#5b8cc0;--s3:#b5452c;--up:#2e7d4f;--down:#b3261e}
@media (prefers-color-scheme:dark){.viz{--bg:#161616;--ink:#f2f2f2;--ink2:#c4c4c4;--ink3:#8a8a8a;--rule:#f2f2f2;--grid:#2c2c2c;--base:#666;
 --s1:#8fb3e0;--s2:#4f86c6;--s3:#e0745a;--up:#5cb87f;--down:#e8705f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}
.viz{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);max-width:860px;margin:0 auto;padding:18px 18px 14px}
.top{border-top:3px solid var(--rule);padding-top:10px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:25px;line-height:1.2;margin:0 0 6px;letter-spacing:-.005em}
.dek{font-size:14px;color:var(--ink2);margin:0 0 16px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--grid);border-bottom:1px solid var(--grid);margin-bottom:14px}
.st{all:unset;cursor:pointer;padding:10px 14px 10px 0;transition:opacity .15s}
.st+.st{border-left:1px solid var(--grid);padding-left:14px}
.st[aria-pressed=false]{opacity:.35}
.st:focus-visible{outline:1px dotted var(--ink3)}
.sl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:7px}
.sl i{width:14px;height:2.5px;background:var(--c);display:inline-block}
.sv{font-size:24px;font-weight:300;margin:5px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sd{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.sd b{font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}
.box{position:relative}
.ax{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-bottom:2px}
svg text{font-family:inherit}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--ink3);padding:8px 10px;font-size:12.5px;opacity:0;transition:opacity .1s;z-index:3;font-variant-numeric:tabular-nums;min-width:230px}
.tip .d{font-weight:700;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid var(--grid)}
.tip .r{display:flex;justify-content:space-between;gap:14px;margin-top:3px}
.tip .r span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.tip .r i{width:12px;height:2.5px;display:inline-block}
.foot{border-top:1px solid var(--grid);margin-top:10px;padding-top:8px;font-size:11.5px;color:var(--ink3);line-height:1.5;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot button{all:unset;cursor:pointer;color:var(--ink2);text-decoration:underline;text-underline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--grid)}th:first-child,td:first-child{text-align:left}
th{color:var(--ink2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--ink3)}
@media(max-width:560px){h1{font-size:20px}.st{padding:8px 6px 8px 0}.st+.st{padding-left:8px}.sv{font-size:17px}.sd{font-size:11.5px}.sl{font-size:10px;letter-spacing:.03em}.sl i{display:none}.tip{min-width:0}}
</style></head><body>
<div class="viz">
 <div class="top">
  <h1>El riesgo país saltó 241 puntos y el Merval perdió casi 10% en dólares</h1>
  <p class="dek">Cierres diarios del Merval en pesos y en dólares y del riesgo país, en valores nominales.</p>
 </div>
 <div class="stats" id="stats"></div>
 <div class="box" id="box">
    <svg id="main" role="img"></svg>
  <div class="tip" id="tip"></div>
 </div>
 <div id="tbl" hidden></div>
 <div class="foot"><span>Semana del 16 al 20 de noviembre de 2026. Merval en dólares: Merval en pesos dividido el tipo de cambio implícito.</span><button id="tt">Ver datos</button></div>
</div>
<script>
const DIA=["Lun 16","Mar 17","Mié 18","Jue 19","Vie 20"],DIAL=["Lunes 16/11","Martes 17/11","Miércoles 18/11","Jueves 19/11","Viernes 20/11"],DIAC=["16/11","17/11","18/11","19/11","20/11"];
const S=[
 {n:"Merval en pesos",sh:"Merval $",c:"--s1",pre:"$",v:[80474.97,82391.79,82331.22,80774.96,80961.47],d:[-5.4,2.4,-0.1,-1.9,0.2],dec:2,sem:-4.9},
 {n:"Merval en dólares",sh:"Merval US$",c:"--s2",pre:"US$",v:[47.93,48.57,47.55,46.33,45.71],d:[-5.5,1.3,-2.1,-2.6,-1.3],dec:2,sem:-9.9},
 {n:"Riesgo país",sh:"Riesgo país",c:"--s3",pre:"",suf:" pb",v:[855,854,848,931,1071],d:[3.0,-0.1,-0.7,9.8,15.0],pb:[25,-1,-6,83,140],dec:0,sem:29.0,semPb:241,inv:true}];
S.forEach(s=>s.ix=s.v.map(v=>v/s.v[0]*100));
const nf=(v,d=0)=>v.toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=v=>(v>0?"+":v<0?"−":"")+nf(Math.abs(v),1)+"%";
const good=(v,inv)=>inv?v<0:v>0;
let on=[true,true,true],hov=-1;
function nice(lo,hi,n){const st0=(hi-lo)/n,mag=Math.pow(10,Math.floor(Math.log10(st0))),r=st0/mag,st=(r<1.5?1:r<3?2:r<7?5:10)*mag,t=[];
 for(let v=Math.floor(lo/st)*st;v<=Math.ceil(hi/st)*st+st/2;v+=st)t.push(+v.toFixed(6));return t}
// curva monótona (Fritsch–Carlson): suaviza sin inventar máximos ni mínimos entre cierres
function smooth(P){const n=P.length,dx=[],dy=[],m=[],t=[];
 for(let i=0;i<n-1;i++){dx[i]=P[i+1][0]-P[i][0];dy[i]=P[i+1][1]-P[i][1];m[i]=dy[i]/dx[i]}
 t[0]=m[0];t[n-1]=m[n-2];for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
 for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=t[i+1]=0;continue}const a=t[i]/m[i],b=t[i+1]/m[i],h=a*a+b*b;if(h>9){const k=3/Math.sqrt(h);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}}
 let d=`M${P[0][0]},${P[0][1]}`;for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=`C${P[i][0]+h},${P[i][1]+h*t[i]} ${P[i+1][0]-h},${P[i+1][1]-h*t[i+1]} ${P[i+1][0]},${P[i+1][1]}`}return d}
const stats=document.getElementById("stats");
S.forEach((s,i)=>{const b=document.createElement("button");b.className="st";b.style.setProperty("--c",`var(${s.c})`);b.title="Mostrar u ocultar en el gráfico";
 b.innerHTML=`<div class="sl"><i></i>${s.n}</div><div class="sv">${s.pre?s.pre+" ":""}${nf(s.v[4],s.dec)}${s.suf||""}</div><div class="sd"><b class="${good(s.sem,s.inv)?"up":"down"}">${pc(s.sem)}</b>${s.semPb?` <b class="down">(+${s.semPb} pb)</b>`:""} en la semana</div>`;
 b.onclick=()=>{if(on[i]&&on.filter(Boolean).length===1)return;on[i]=!on[i];draw()};stats.appendChild(b)});
const box=document.getElementById("box"),M=document.getElementById("main"),tip=document.getElementById("tip");let geo;
function draw(){
 [...stats.children].forEach((b,i)=>b.setAttribute("aria-pressed",on[i]));
 const W=box.clientWidth,mob=W<560,vis=S.filter((s,i)=>on[i]);
 const bandH=mob?130:140,gap=14,m={t:4,r:mob?16:24,b:28,l:mob?52:64},H=m.t+vis.length*bandH+(vis.length-1)*gap+m.b;
 const X=i=>m.l+24+i*(W-m.l-m.r-48)/4;
 geo={X,m,W};M.setAttribute("width",W);M.setAttribute("height",H);
 M.setAttribute("aria-label",vis.map(s=>`${s.n}: ${s.v.map(v=>nf(v,s.dec)).join(", ")}`).join("; "));
 let h="";const units={"Merval en pesos":"Puntos","Merval en dólares":"US$","Riesgo país":"Puntos básicos"};
 vis.forEach((s,k)=>{
  const top=m.t+k*(bandH+gap),pt=26,pb=8,lo=Math.min(...s.v),hi=Math.max(...s.v),sp=hi-lo,ticks=nice(lo-sp*.15,hi+sp*.3,3),Y0=ticks[0],Y1=ticks[ticks.length-1];
  const Y=v=>top+pt+(Y1-v)/(Y1-Y0)*(bandH-pt-pb);s._Y=Y;
  if(k>0)h+=`<line x1="0" x2="${W}" y1="${top-gap/2}" y2="${top-gap/2}" stroke="var(--grid)"/>`;
  h+=`<text x="0" y="${top+13}" font-size="12" font-weight="700" fill="var(${s.c})">${s.n.toUpperCase()}</text><text x="${W-m.r}" y="${top+13}" text-anchor="end" font-size="11" fill="var(--ink3)">${units[s.n]}</text>`;
  const td=Y1-Y0<10?1:0;
  ticks.forEach(v=>h+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink3)">${nf(v,td)}</text>`);
  h+=`<path d="${smooth(s.v.map((v,i)=>[X(i),Y(v)]))}" fill="none" stroke="var(${s.c})" stroke-width="2.25" stroke-linecap="round"/>`;
  s.v.forEach((v,i)=>{const a=hov===i;h+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${a?4.5:3}" fill="${a?"var(--bg)":`var(${s.c})`}" stroke="var(${s.c})" stroke-width="2"/>`;
   h+=`<text x="${X(i)}" y="${Y(v)-9}" text-anchor="middle" font-size="${mob?10.5:11.5}" font-weight="${i===4||a?700:400}" fill="var(--ink)" stroke="var(--bg)" stroke-width="3" style="paint-order:stroke">${nf(v,s.n==="Merval en dólares"?2:0)}</text>`})});
 h+=`<line x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}" stroke="var(--ink2)"/>`;
 DIA.forEach((d,i)=>h+=`<line x1="${X(i)}" x2="${X(i)}" y1="${H-m.b}" y2="${H-m.b+4}" stroke="var(--ink2)"/><text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11.5" fill="var(--ink2)" font-weight="${hov===i?700:400}">${mob?DIAC[i]:d}</text>`);
 if(hov>=0)h=`<line x1="${X(hov)}" x2="${X(hov)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--ink3)" stroke-dasharray="2,3"/>`+h;
 M.innerHTML=h;
 if(hov>=0){const i=hov;
  tip.innerHTML=`<div class="d">${DIAL[i]}</div>`+vis.map(s=>`<div class="r"><span><i style="background:var(${s.c})"></i>${mob?s.sh:s.n}</span><span><b>${s.pre?s.pre+" ":""}${nf(s.v[i],s.dec)}</b> <span class="${good(s.d[i],s.inv)?"up":"down"}">${pc(s.d[i])}${s.pb?` (${s.pb[i]>0?"+":""}${s.pb[i]} pb)`:""}</span></span></div>`).join("");
  tip.style.opacity=1;const tw=tip.offsetWidth,xi=X(i);tip.style.left=Math.max(0,Math.min(W-tw,xi+tw+16>W?xi-tw-16:xi+16))+"px";tip.style.top=(H-m.b-tip.offsetHeight-8)+"px"}
 else tip.style.opacity=0;
}
function pick(cx){const r=box.getBoundingClientRect(),x=cx-r.left,{X,m,W}=geo;if(x<m.l||x>W-m.r+20)return -1;let b=0;for(let i=1;i<5;i++)if(Math.abs(X(i)-x)<Math.abs(X(b)-x))b=i;return b}
M.addEventListener("mousemove",e=>{const i=pick(e.clientX);if(i!==hov){hov=i;draw()}});
M.addEventListener("mouseleave",()=>{hov=-1;draw()});
M.addEventListener("touchstart",e=>{hov=pick(e.touches[0].clientX);draw()},{passive:true});
const tbl=document.getElementById("tbl");
tbl.innerHTML=`<table><thead><tr><th>Fecha</th><th>Merval ($)</th><th>Var.</th><th>Merval (US$)</th><th>Var.</th><th>Riesgo país</th><th>Var. (pb)</th></tr></thead><tbody>${DIAL.map((d,i)=>`<tr><td>${d}</td><td>${nf(S[0].v[i],2)}</td><td>${pc(S[0].d[i])}</td><td>${nf(S[1].v[i],2)}</td><td>${pc(S[1].d[i])}</td><td>${S[2].v[i]}</td><td>${S[2].pb[i]>0?"+":""}${S[2].pb[i]}</td></tr>`).join("")}<tr><td><b>Semana</b></td><td></td><td><b>${pc(S[0].sem)}</b></td><td></td><td><b>${pc(S[1].sem)}</b></td><td></td><td><b>+241</b></td></tr></tbody></table>`;
document.getElementById("tt").onclick=e=>{tbl.hidden=!tbl.hidden;e.target.textContent=tbl.hidden?"Ver datos":"Ocultar datos"};
window.addEventListener("resize",draw);draw();
</script></body></html>
