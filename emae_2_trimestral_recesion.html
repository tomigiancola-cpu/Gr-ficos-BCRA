<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMAE trimestral: cómo se configuró la recesión técnica</title>
<style>*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.viz-root{
  color-scheme:light;
  --page:#f4f3ef; --surface:#fcfcfb; --surface-2:#f3f2ee;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e6e5df; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#12305a; --band:rgba(18,48,90,.055);
  --s1:#1c5cab; --s2:#14a085; --s3:#d9822b;
  --pos:#1c5cab; --neg:#d6453d;
  --h-n3:#b42f2e; --h-n2:#e2685f; --h-n1:#f5c3bc; --h-0:#ecebe6; --h-p1:#c2d9f5; --h-p2:#5d97e0; --h-p3:#1c5cab;
  --shadow:0 6px 24px rgba(11,11,11,.12);
  color:var(--ink);
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])) .viz-root{
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
    --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#45453f; --border:rgba(255,255,255,.10);
    --accent:#8fb3e6; --band:rgba(143,179,230,.07);
    --s1:#3987e5; --s2:#14a085; --s3:#d27a26;
    --pos:#3d82dc; --neg:#e05a52;
    --h-n3:#ef7f75; --h-n2:#b0453d; --h-n1:#6e3530; --h-0:#363633; --h-p1:#2b4a72; --h-p2:#2f69b3; --h-p3:#6aa3ec;
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] .viz-root{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#45453f; --border:rgba(255,255,255,.10);
  --accent:#8fb3e6; --band:rgba(143,179,230,.07);
  --s1:#3987e5; --s2:#14a085; --s3:#d27a26;
  --pos:#3d82dc; --neg:#e05a52;
  --h-n3:#ef7f75; --h-n2:#b0453d; --h-n1:#6e3530; --h-0:#363633; --h-p1:#2b4a72; --h-p2:#2f69b3; --h-p3:#6aa3ec;
  --shadow:0 6px 24px rgba(0,0,0,.5);
}
.viz-root{max-width:1120px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:22px 24px 18px;border-top:3px solid var(--accent)}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
h1{font-size:clamp(20px,2.6vw,26px);line-height:1.2;font-weight:700;margin:0 0 16px;letter-spacing:-.01em;text-wrap:balance}
.dek{font-size:14.5px;line-height:1.45;color:var(--ink-2);margin:0 0 18px;max-width:780px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:0 0 18px}
.tile{border:1px solid var(--border);border-radius:6px;padding:12px 14px 11px;background:var(--surface)}
.tile .lab{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
.tile .val{font-size:30px;font-weight:650;line-height:1.1;letter-spacing:-.01em}
.tile .sub{font-size:12px;color:var(--muted);margin-top:3px}
.tile .dir{font-size:13px;margin-right:4px}
.key-line{display:inline-block;width:16px;height:0;border-top:2.5px solid currentColor;border-radius:2px;flex:none}
.key-rect{display:inline-block;width:10px;height:10px;border-radius:2px;background:currentColor;flex:none}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:0 0 10px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink-2);padding:6px 12px;cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.seg button:hover:not([aria-pressed="true"]){background:var(--surface-2)}
.ctl-label{font-size:12px;color:var(--muted);margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 0 6px}
.legend button,.legend span.li{font:inherit;font-size:13px;color:var(--ink);background:none;border:0;padding:3px 0;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.legend span.li{cursor:default}
.legend button[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.legend button[aria-pressed="false"] .key-line,.legend button[aria-pressed="false"] .key-rect{opacity:.3}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart svg:focus{outline:none}
.chart svg:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
svg text{font-family:inherit}
.tick{font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.yr{font-size:12px;fill:var(--ink-2);font-weight:600}
.dlabel{font-size:12px;fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dlabel-2{font-size:11.5px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.annot{font-size:12px;fill:var(--ink-2)}
.annot-b{font-size:12px;fill:var(--ink);font-weight:600}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.tt{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:6px;padding:9px 11px;font-size:12.5px;min-width:170px;opacity:0;transition:opacity .08s;z-index:5}
.tt.on{opacity:1}
.tt .tt-h{font-size:12px;color:var(--ink-2);margin-bottom:6px;font-weight:600}
.tt .row{display:flex;align-items:center;gap:8px;margin:3px 0;white-space:nowrap}
.tt .row b{font-weight:650;font-variant-numeric:tabular-nums;min-width:52px;color:var(--ink)}
.tt .row span.n{color:var(--ink-2)}
.tt .foot{margin-top:6px;padding-top:6px;border-top:1px solid var(--border);color:var(--muted);font-size:11.5px;white-space:nowrap}
.panel-title{font-size:15px;font-weight:650;margin:22px 0 2px}
.panel-dek{font-size:13px;color:var(--ink-2);margin:0 0 8px}
.callout{border-left:3px solid var(--accent);background:var(--band);padding:9px 12px;font-size:13.5px;line-height:1.45;color:var(--ink);margin:10px 0 4px;border-radius:0 4px 4px 0}
.foot-wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 20px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.source{font-size:12px;color:var(--muted);line-height:1.5;max-width:760px}
.source a{color:var(--ink-2)}
.actions{display:flex;gap:8px;flex:none}
.btn{font:inherit;font-size:12.5px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:6px 11px;border-radius:6px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.tbl-wrap{display:none;margin-top:12px;max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:6px}
.tbl-wrap.on{display:block}
table.data{border-collapse:collapse;width:100%;font-size:12.5px}
table.data th,table.data td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap;font-variant-numeric:tabular-nums}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data thead th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);font-weight:600;z-index:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
select.sel{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper .btn{padding:5px 9px;line-height:1}
.tile .val.sm{font-size:22px}
.tile .lab .short{display:none}
.heat-wrap{display:flex;align-items:flex-start}
#heatLabels{flex:none}
.heat-scroll{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.bins{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 8px;font-size:12px;color:var(--ink-2)}
.bins span{display:inline-flex;align-items:center;gap:6px}
.bins i{display:inline-block;width:18px;height:11px;border-radius:2px}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0}
@media (max-width:640px){.card{padding:16px 14px 14px}.viz-root{padding:8px}.tiles{grid-template-columns:repeat(auto-fit,minmax(102px,1fr));gap:8px}.tile{padding:9px 10px}.tile .val{font-size:21px}.tile .val.sm{font-size:18px}.tile .lab{font-size:11.5px}.tile .sub{font-size:11px}.tiles.four{grid-template-columns:repeat(2,1fr)}.tile .lab .full{display:none}.tile .lab .short{display:inline}}
@media print{.controls,.actions,.tt{display:none!important}.viz-root{padding:0}}
</style>
</head>

</article>
</div>

function buildTable(wrap,headers,rows){
  wrap.replaceChildren();
  const t=h('table','data',wrap);const th=h('thead',null,t);const tr=h('tr',null,th);
  headers.forEach(x=>h('th',null,tr,x));
  const tb=h('tbody',null,t);
  rows.forEach(r=>{const row=h('tr',null,tb);r.forEach(c=>h('td',null,row,c))});
}
function wireFooter(tblBtn,wrap,getTable){
  tblBtn.addEventListener('click',()=>{
    const on=!wrap.classList.contains('on');
    if(on){const t=getTable();buildTable(wrap,t.headers,t.rows)}
    wrap.classList.toggle('on',on);tblBtn.textContent=on?'Ocultar tabla':'Ver tabla';
    tblBtn.setAttribute('aria-expanded',on);
  });
}
function segmented(container,options,value,onChange){
  container.replaceChildren();
  options.forEach(o=>{
    const b=h('button',null,container,o.label);b.type='button';
    b.setAttribute('aria-pressed',o.value===value);
    b.addEventListener('click',()=>{
      [...container.children].forEach(c=>c.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');onChange(o.value);
    });
  });
}
function onResize(elm,fn){
  let w=0;const ro=new ResizeObserver(()=>{const nw=elm.clientWidth;if(Math.abs(nw-w)>1){w=nw;fn()}});ro.observe(elm);
}
// evita choques de etiquetas en el margen derecho
function spreadLabels(items,minGap,top,bottom){
  items.sort((a,b)=>a.y-b.y);
  for(let i=1;i<items.length;i++){if(items[i].ly<items[i-1].ly+minGap)items[i].ly=items[i-1].ly+minGap}
  const over=items.length?items[items.length-1].ly-bottom:0;
  if(over>0){items[items.length-1].ly-=over;for(let i=items.length-2;i>=0;i--){if(items[i].ly>items[i+1].ly-minGap)items[i].ly=items[i+1].ly-minGap}}
  items.forEach(it=>{if(it.ly<top)it.ly=top});
  return items;
}
function axisNum(t,step){
  const dec=step<1?(step<0.1?2:1):0;
  const s=new Intl.NumberFormat('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(Math.abs(t));
  return (t<0?'−':'')+s;
}

(function(){
const Q=DATA.quarters, M=DATA.monthly, META=DATA.meta;
const st={mode:'qq'};

const qOf=d=>{const y=+d.slice(0,4),m=+d.slice(5);return Q.find(q=>q.y===y&&q.q===Math.floor((m-1)/3)+1)};
// recesiones: tramos de 2+ trimestres consecutivos con caída s.e.
const runs=[];let cur=null;
Q.forEach((q,i)=>{if(q.qq!=null&&q.qq<0){if(!cur)cur={a:i,b:i};else cur.b=i}else{if(cur&&cur.b>cur.a)runs.push(cur);cur=null}});
if(cur&&cur.b>cur.a)runs.push(cur);
const inRun=i=>runs.some(r=>i>=r.a&&i<=r.b);
const L=Q[Q.length-1], P=Q[Q.length-2];

// tiles
const tiles=document.getElementById('tiles');
[[P.qq,`${P.k} vs. ${Q[Q.length-3].k}`,'Desestacionalizado'],
 [L.qq,`${L.k} vs. ${P.k}`,'Desestacionalizado'],
 [L.yy,`${L.k} vs. ${Q[Q.length-5].k}`,'Interanual, serie original']].forEach(([v,lab,sub])=>{
  const t=h('div','tile',tiles);h('div','lab',t,lab);

const legA=document.getElementById('legendA');
function drawLegA(){

  [['var(--pos)','Suba'],['var(--neg)','Caída']].forEach(([c,t])=>{const s=h('span','li',legA);const k=h('span','key-rect',s);k.style.color=c;h('span',null,s,t)});
  const s=h('span','li',legA);const k=h('span','key-rect',s);k.style.color='var(--band)';k.style.background='var(--band)';k.style.outline='1px solid var(--border)';

drawLegA();
segmented(document.getElementById('mode'),[{label:'Trimestre anterior (s.e.)',value:'qq'},{label:'Igual trimestre año anterior',value:'yy'}],st.mode,v=>{st.mode=v;renderA()});

// ---------- Panel A: barras trimestrales ----------
const cA=document.getElementById('chartA');const ttA=Tooltip(cA);let svgA;
function bandsAndYears(svg,W,H,mg,n,slot,labelBands,yearsY){
  const g=el('g',null,svg);
  runs.forEach((r,j)=>{
    const x0=mg.l+slot*r.a, x1=mg.l+slot*(r.b+1);
    el('rect',{x:x0,y:mg.t-22,width:x1-x0,height:H-mg.b-mg.t+22,fill:'var(--band)'},g);
    if(labelBands){
      el('text',{x:x0+6,y:mg.t-8,class:'annot-b'},g,(x1-x0)>118?'Recesión técnica':'Recesión');
    }
  });
  return g;
}
function renderA(){
  const W=cA.clientWidth;if(!W)return;const narrow=W<560;
  const H=Math.round(Math.max(280,Math.min(400,W*.4)));
  const mg={l:narrow?34:42,r:12,t:36,b:46};
  const n=Q.length,pw=W-mg.l-mg.r,ph=H-mg.t-mg.b,slot=pw/n,cx=i=>mg.l+slot*(i+.5);
  const key=st.mode;const vals=Q.map(q=>q[key]).filter(v=>v!=null);
  const dom=niceDomain(Math.min(0,...vals),Math.max(0,...vals),narrow?4:6);
  const y=v=>mg.t+ph*(1-(v-dom.lo)/(dom.hi-dom.lo));
  if(svgA)svgA.remove();

  cA.insertBefore(svgA,ttA.el);
  bandsAndYears(svgA,W,H,mg,n,slot,true);
  const gG=el('g',null,svgA),gD=el('g',null,svgA),gL=el('g',null,svgA);
  dom.ticks.forEach(t=>{
    el('line',{x1:mg.l,x2:W-mg.r,y1:y(t),y2:y(t),stroke:'var(--grid)','shape-rendering':'crispEdges'},gG);
    el('text',{x:mg.l-8,y:y(t)+4,'text-anchor':'end',class:'tick'},gG,axisNum(t,dom.st));
  });
  el('text',{x:mg.l-8,y:mg.t-22,'text-anchor':'end',class:'tick'},gG,'%');
  el('line',{x1:mg.l,x2:W-mg.r,y1:y(0),y2:y(0),stroke:'var(--axis)','shape-rendering':'crispEdges'},gG);
  // ejes x
  Q.forEach((q,i)=>{
    el('text',{x:cx(i),y:H-mg.b+17,'text-anchor':'middle',class:'tick'},gG,q.q+'T');
    if(q.q===1&&i>0)el('line',{x1:mg.l+slot*i,x2:mg.l+slot*i,y1:H-mg.b+4,y2:H-mg.b+36,stroke:'var(--grid)','shape-rendering':'crispEdges'},gG);
  });
  [...new Set(Q.map(q=>q.y))].forEach(yr=>{
    const ix=Q.map((q,i)=>q.y===yr?i:-1).filter(i=>i>=0);
    el('text',{x:(cx(ix[0])+cx(ix[ix.length-1]))/2,y:H-mg.b+35,'text-anchor':'middle',class:'yr'},gG,yr);
  });
  const w=Math.min(24,slot*.56);
  const ok=Q.map((q,i)=>i).filter(i=>Q[i][key]!=null);
  const mn=ok.reduce((a,i)=>Q[i][key]<Q[a][key]?i:a,ok[0]), mx=ok.reduce((a,i)=>Q[i][key]>Q[a][key]?i:a,ok[0]);
  const bars=[];
  Q.forEach((q,i)=>{
    const v=q[key];
    if(v==null){el('text',{x:cx(i),y:y(0)-8,'text-anchor':'middle',class:'tick'},gD,'s/d');bars.push(null);return}
    const p=el('path',{d:colPath(cx(i)-w/2,w,y(0),y(v),4),fill:v>=0?'var(--pos)':'var(--neg)'},gD);bars.push(p);
    const lastRun=runs.length?runs[runs.length-1]:null;
    const lab=narrow?(i===n-1||(key==='qq'&&lastRun&&i>=lastRun.a)):(key==='qq'?(v<0||i===n-1):(i===n-1||i===mn||i===mx));
    if(lab){const ly=v>=0?y(v)-7:y(v)+15;el('text',{x:cx(i),y:ly,'text-anchor':'middle',class:'dlabel halo'},gL,pct(v))}
  });
  const cross=el('rect',{y:mg.t-22,height:H-mg.b-mg.t+22,width:slot,fill:'var(--ink)',opacity:0},svgA);
  svgA.insertBefore(cross,gD);
  const hit=el('rect',{x:mg.l,y:mg.t-22,width:pw,height:H-mg.t+22,fill:'transparent'},svgA);
  let hov=null;
  function show(i,px,py){
    hov=i;const q=Q[i];cross.setAttribute('x',mg.l+slot*i);cross.setAttribute('opacity',.05);
    bars.forEach((b,j)=>b&&b.setAttribute('opacity',j===i?1:.55));
    ttA.show(b=>{
      ttHead(b,qLong(q)+' ('+qMeses(q)+')');
      const c1=q.qq==null?'var(--muted)':(q.qq>=0?'var(--pos)':'var(--neg)'),c2=q.yy>=0?'var(--pos)':'var(--neg)';
      ttRow(b,c1,'rect',pct(q.qq),'vs. trimestre anterior (s.e.)');
      ttRow(b,c2,'rect',pct(q.yy),'vs. igual trimestre año anterior');
      ttFoot(b,`Promedio índice s.e.: ${num(q.sa)}${inRun(i)?' · recesión técnica':''}`);
    },px==null?cx(i):px,py==null?mg.t+30:py);

  hit.addEventListener('pointermove',ev=>{const r=svgA.getBoundingClientRect();const x=(ev.clientX-r.left)*W/r.width;
    const i=Math.max(0,Math.min(n-1,Math.floor((x-mg.l)/slot)));const cr=cA.getBoundingClientRect();show(i,ev.clientX-cr.left,ev.clientY-cr.top)});
  hit.addEventListener('pointerleave',clear);
  svgA.addEventListener('keydown',ev=>{if(ev.key!=='ArrowLeft'&&ev.key!=='ArrowRight')return;ev.preventDefault();
    let i=hov==null?n-1:hov+(ev.key==='ArrowRight'?1:-1);show(Math.max(0,Math.min(n-1,i)))});

// ---------- Panel B: nivel mensual vs promedio trimestral ----------
const legB=document.getElementById('legendB');
[['var(--s1)','Índice mensual desestacionalizado'],['var(--s3)','Promedio del trimestre']].forEach(([c,t])=>{const s=h('span','li',legB);const k=h('span','key-line',s);k.style.color=c;h('span',null,s,t)});
const cB=document.getElementById('chartB');const ttB=Tooltip(cB);let svgB;
function renderB(){

  const H=Math.round(Math.max(280,Math.min(380,W*.38)));
  const mg={l:narrow?34:42,r:narrow?58:96,t:30,b:46};
  const n=M.length,pw=W-mg.l-mg.r,ph=H-mg.t-mg.b,slot=pw/n,cx=i=>mg.l+slot*(i+.5);
  // runs en meses
  const mRuns=runs.map(r=>({a:M.findIndex(m=>m.d===Q[r.a].months[0]),b:M.findIndex(m=>m.d===Q[r.b].months[2])}));
  const vals=M.map(m=>m.sa);const dom=niceDomain(Math.min(...vals)-1,Math.max(...vals)+1,narrow?4:5);
  const y=v=>mg.t+ph*(1-(v-dom.lo)/(dom.hi-dom.lo));
  if(svgB)svgB.remove();
  svgB=el('svg',{viewBox:`0 0 ${W} ${H}`,height:H,role:'img',tabindex:0,'aria-label':'EMAE desestacionalizado mensual y promedio trimestral.'});
  cB.insertBefore(svgB,ttB.el);
  const gBand=el('g',null,svgB);
  mRuns.forEach(r=>el('rect',{x:mg.l+slot*r.a,y:mg.t-14,width:slot*(r.b-r.a+1),height:H-mg.b-mg.t+14,fill:'var(--band)'},gBand));
  const gG=el('g',null,svgB),gD=el('g',null,svgB),gL=el('g',null,svgB),gH=el('g',null,svgB);
  dom.ticks.forEach(t=>{el('line',{x1:mg.l,x2:W-mg.r,y1:y(t),y2:y(t),stroke:'var(--grid)','shape-rendering':'crispEdges'},gG);
    el('text',{x:mg.l-8,y:y(t)+4,'text-anchor':'end',class:'tick'},gG,axisNum(t,dom.st))});
  M.forEach((d,i)=>{const m=+d.d.slice(5);
    if(m===1&&i>0)el('line',{x1:mg.l+slot*i,x2:mg.l+slot*i,y1:mg.t,y2:H-mg.b+36,stroke:'var(--grid)','shape-rendering':'crispEdges'},gG);
    if(slot>=13||m%3===1)el('text',{x:cx(i),y:H-mg.b+17,'text-anchor':'middle',class:'tick'},gG,MES1[m-1])});
  [...new Set(M.map(d=>d.d.slice(0,4)))].forEach(yr=>{const ix=M.map((d,i)=>d.d.startsWith(yr)?i:-1).filter(i=>i>=0);
    el('text',{x:(cx(ix[0])+cx(ix[ix.length-1]))/2,y:H-mg.b+35,'text-anchor':'middle',class:'yr'},gG,yr)});
  // escalones trimestrales
  Q.forEach(q=>{const a=M.findIndex(m=>m.d===q.months[0]);
    el('line',{x1:mg.l+slot*a+2,x2:mg.l+slot*(a+3)-2,y1:y(q.sa),y2:y(q.sa),stroke:'var(--s3)','stroke-width':2.5,'stroke-linecap':'round'},gD)});
  el('path',{d:M.map((d,i)=>(i?'L':'M')+cx(i).toFixed(1)+','+y(d.sa).toFixed(1)).join(''),fill:'none',stroke:'var(--s1)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'},gD);
  // anotaciones
  const iJul=M.findIndex(m=>m.d==='2026-07'), q2=Q[Q.length-2], q3=Q[Q.length-1];
  const a2=M.findIndex(m=>m.d===q2.months[0]);
  const lyQ=Math.max(mg.t+2,y(Math.max(...M.slice(a2-3,a2+3).map(m=>m.sa)))-14);const xq=mg.l+slot*(a2+1.5);
  el('path',{d:`M${xq},${lyQ+4}V${y(q2.sa)-3}`,stroke:'var(--axis)',fill:'none'},gL);
  el('text',{x:xq,y:lyQ,'text-anchor':'middle',class:'dlabel halo'},gL,narrow?num(q2.sa):'Prom. 2T-26: '+num(q2.sa));

  el('circle',{cx:cx(iL),cy:y(M[iL].sa),r:4,fill:'var(--s1)',stroke:'var(--surface)','stroke-width':2},gL);
  spreadLabels(ends,15,mg.t,H-mg.b);
  ends.forEach(o=>{const lx=W-mg.r+10;
    el('path',{d:`M${o.x+(o.dot?5:2)},${o.y}L${lx-3},${o.ly}`,stroke:'var(--axis)',fill:'none'},gL);
    el('text',{x:lx,y:o.ly+4,class:'dlabel'},gL,o.t)});
  // hover
  const cross=el('line',{y1:mg.t,y2:H-mg.b,stroke:'var(--ink-2)',opacity:0,'shape-rendering':'crispEdges'},gH);
  const dot=el('circle',{r:4.5,fill:'var(--s1)',stroke:'var(--surface)','stroke-width':2,opacity:0},gH);
  const hit=el('rect',{x:mg.l,y:mg.t,width:pw,height:ph+mg.b-10,fill:'transparent'},svgB);
  let hov=null;
  function show(i,px,py){hov=i;const d=M[i],q=qOf(d.d);
    cross.setAttribute('x1',cx(i));cross.setAttribute('x2',cx(i));cross.setAttribute('opacity',.5);
    dot.setAttribute('cx',cx(i));dot.setAttribute('cy',y(d.sa));dot.setAttribute('opacity',1);
    ttB.show(b=>{ttHead(b,mesLargo(d.d));ttRow(b,'var(--s1)','line',num(d.sa),'Índice s.e.');
      ttRow(b,'var(--s3)','line',num(q.sa),'Promedio '+q.k);ttFoot(b,'Var. mensual s.e.: '+pct(d.sam))},px==null?cx(i):px,py==null?mg.t+30:py)}
  function clear(){hov=null;cross.setAttribute('opacity',0);dot.setAttribute('opacity',0);ttB.hide()}
  hit.addEventListener('pointermove',ev=>{const r=svgB.getBoundingClientRect();const x=(ev.clientX-r.left)*W/r.width;
    const i=Math.max(0,Math.min(n-1,Math.floor((x-mg.l)/slot)));const cr=cB.getBoundingClientRect();show(i,ev.clientX-cr.left,ev.clientY-cr.top)});
  hit.addEventListener('pointerleave',clear);
  svgB.addEventListener('keydown',ev=>{if(ev.key!=='ArrowLeft'&&ev.key!=='ArrowRight')return;ev.preventDefault();
    let i=hov==null?n-1:hov+(ev.key==='ArrowRight'?1:-1);show(Math.max(0,Math.min(n-1,i)))});

}
onResize(cA,renderA);onResize(cB,renderB);renderA();renderB();
