  h+=`<circle cx="${xm}" cy="${ym}" r="3" fill="var(--bg)" stroke="var(${s.c})" stroke-width="1.5"/><text x="${xm}" y="${ym-7}" text-anchor="middle" font-size="11" fill="var(--ink2)" stroke="var(--bg)" stroke-width="3" style="paint-order:stroke">Máx. ${nf(s.max)}</text>`;
  const xl=X(dates[L]),yl=Y(s.v[L]);
  h+=`<circle cx="${xl}" cy="${yl}" r="3.5" fill="var(${s.c})"/><text x="${xl+7}" y="${yl+4}" font-size="11.5" font-weight="700" fill="var(--ink)" stroke="var(--bg)" stroke-width="3" style="paint-order:stroke">${nf(s.v[L])}</text>`;
  if(hov>=0)h+=`<circle cx="${X(dates[hov])}" cy="${Y(s.v[hov])}" r="4" fill="var(--bg)" stroke="var(${s.c})" stroke-width="2"/>`;
 });
 h+=`<line x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}" stroke="var(--ink2)"/>`;
 for(let i=0;i<12;i++){const d=new Date(2026,i,1),x=X(d);h+=`<line x1="${x}" x2="${x}" y1="${H-m.b}" y2="${H-m.b+4}" stroke="var(--ink2)"/>`;
  if(!mob||i%2==0)h+=`<text x="${x+ (mob?0:(X(new Date(2026,i+1,1))-x)/2)}" y="${H-8}" text-anchor="${mob?"start":"middle"}" font-size="11.5" fill="var(--ink2)">${MES[i]}</text>`}
 if(hov>=0)h=`<line x1="${X(dates[hov])}" x2="${X(dates[hov])}" y1="${m.t}" y2="${H-m.b}" stroke="var(--ink3)" stroke-dasharray="2,3"/>`+h;
 M.innerHTML=h;
 if(hov>=0){const i=hov;
  tip.innerHTML=`<div class="d">${fd(dates[i])}${i===L?" (preliminar)":""}</div><div class="r"><span></span><span class="h">Cierre</span><span class="h">Día</span><span class="h">Año</span>`+vis.map(s=>{const dd=i?(s.v[i]/s.v[i-1]-1)*100:0,y=(s.v[i]/s.v[0]-1)*100;
   return `<span><i style="background:var(${s.c})"></i>${s.sh||s.n}</span><b class="n">${nf(s.v[i],2)}</b><span class="n ${dd>=0?"up":"down"}">${i?pc(dd):"–"}</span><span class="n ${y>=0?"up":"down"}">${pc(y)}</span>`}).join("")+`</div>`;
  tip.style.opacity=1;const tw=tip.offsetWidth,xi=X(dates[i]);tip.style.left=Math.max(0,Math.min(W-tw,xi+tw+16>W?xi-tw-16:xi+16))+"px";tip.style.top=(m.t+bandH*.55)+"px"}
 else tip.style.opacity=0;
}
function pick(cx){const r=box.getBoundingClientRect(),x=cx-r.left,{X,m,W}=geo;if(x<m.l-4||x>W-m.r+4)return -1;let b=0,bd=1e9;dates.forEach((d,i)=>{const z=Math.abs(X(d)-x);if(z<bd){bd=z;b=i}});return b}
M.addEventListener("mousemove",e=>{const i=pick(e.clientX);if(i!==hov){hov=i;draw()}});
M.addEventListener("mouseleave",()=>{hov=-1;draw()});
M.addEventListener("touchstart",e=>{hov=pick(e.touches[0].clientX);draw()},{passive:true});
M.addEventListener("touchmove",e=>{const i=pick(e.touches[0].clientX);if(i!==hov){hov=i;draw()}e.preventDefault()},{passive:false});
window.addEventListener("resize",draw);draw();
</script></body></html>
