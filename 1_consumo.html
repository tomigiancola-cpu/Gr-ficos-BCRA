<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventas en supermercados y mayoristas</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f5f7; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #111827; display: flex; justify-content: center; padding: 24px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); padding: 28px 32px 20px; width: 100%; max-width: 920px; }
  .tag { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #6b7280; }
  h1 { font-size: 26px; margin: 4px 0 18px; font-weight: 700; letter-spacing: -.01em; }
  .kpis { display: flex; flex-wrap: wrap; gap: 12px 40px; margin-bottom: 8px; }
  .kpi .n { font-size: 40px; font-weight: 800; line-height: 1; color: #dc2626; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .kpi:not(:first-child) .n { font-size: 26px; color: #374151; margin-top: 14px; }
  .kpi .l { font-size: 13px; color: #6b7280; margin-top: 4px; }
  .leg { display: flex; gap: 18px; font-size: 13px; color: #374151; margin: 14px 0 0; }
  .leg i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .chart { position: relative; }
  svg { display: block; width: 100%; height: auto; }
  .tick { font-size: 12px; fill: #9ca3af; }
  .grid { stroke: #eef0f3; }
  .end { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; pointer-events: none; background: #111827; color: #fff; padding: 7px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap; display: none; font-variant-numeric: tabular-nums; }
  .tip b { display: block; margin-bottom: 2px; }
  .foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 11.5px; color: #9ca3af; margin-top: 6px; }
</style>
</head>
<body>
<div class="card">
  <div class="tag">Consumo</div>
  <h1>Ventas en supermercados y mayoristas</h1>
  <div class="kpis"><div class="kpi"><div class="n">−3,9%</div><div class="l">supermercados · sep-26 vs sep-25</div></div><div class="kpi"><div class="n">+0,4%</div><div class="l">mayoristas · sep-26 vs sep-25</div></div></div>
  <div class="leg" id="leg"></div>
  <div class="chart"><svg id="svg" viewBox="0 0 880 340" role="img" aria-label="Ventas en supermercados y mayoristas"></svg><div class="tip" id="tip"></div></div>
  <div class="foot"><span>Variación % contra el mismo mes del año anterior · precios constantes</span><span>Fuente: INDEC</span></div>
</div>
<script>
const D = {"series": [{"name": "Supermercados", "color": "#2563eb", "pts": [["2023-01", 2.8], ["2023-02", 0.9], ["2023-03", 3.5], ["2023-04", 3.3], ["2023-05", 0.3], ["2023-06", -0.7], ["2023-07", -1.6], ["2023-08", 4.6], ["2023-09", 1.2], ["2023-10", 9.9], ["2023-11", -1.3], ["2023-12", -7.0], ["2024-01", -13.9], ["2024-02", -14.0], ["2024-03", -13.6], ["2024-04", -12.7], ["2024-05", -10.7], ["2024-06", -9.8], ["2024-07", -10.1], ["2024-08", -11.8], ["2024-09", -10.5], ["2024-10", -18.4], ["2024-11", -9.3], ["2024-12", 0.1], ["2025-01", 3.5], ["2025-02", 4.5], ["2025-03", 6.2], ["2025-04", 5.0], ["2025-05", 3.8], ["2025-06", 3.4], ["2025-07", 0.2], ["2025-08", -0.1], ["2025-09", -0.1], ["2025-10", 2.7], ["2025-11", -2.8], ["2025-12", 0.8], ["2026-01", -2.9], ["2026-02", -3.0], ["2026-03", -4.2], ["2026-04", -2.8], ["2026-05", -1.5], ["2026-06", -2.7], ["2026-07", -2.2], ["2026-08", -2.7], ["2026-09", -3.9]]}, {"name": "Mayoristas", "color": "#f59e0b", "pts": [["2023-01", 2.4], ["2023-02", -3.8], ["2023-03", 0.5], ["2023-04", 6.7], ["2023-05", 2.6], ["2023-06", 3.3], ["2023-07", -2.7], ["2023-08", 10.2], ["2023-09", 15.2], ["2023-10", 29.6], ["2023-11", 5.4], ["2023-12", -7.1], ["2024-01", -7.7], ["2024-02", -10.1], ["2024-03", -10.9], ["2024-04", -19.5], ["2024-05", -14.4], ["2024-06", -14.8], ["2024-07", -16.1], ["2024-08", -15.0], ["2024-09", -21.3], ["2024-10", -23.6], ["2024-11", -10.7], ["2024-12", -13.8], ["2025-01", -11.8], ["2025-02", -5.1], ["2025-03", -3.7], ["2025-04", -3.2], ["2025-05", -4.6], ["2025-06", -7.0], ["2025-07", -7.4], ["2025-08", -7.9], ["2025-09", -11.9], ["2025-10", -9.4], ["2025-11", -9.5], ["2025-12", 2.3], ["2026-01", 0.6], ["2026-02", -1.1], ["2026-03", -6.7], ["2026-04", -5.4], ["2026-05", -2.3], ["2026-06", -2.3], ["2026-07", -0.7], ["2026-08", -3.0], ["2026-09", 0.4]]}], "pct": true, "ref": 0};
const W = 880, H = 340, M = { t: 14, r: 70, b: 28, l: 52 };
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg'), tip = document.getElementById('tip');
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const t = (m) => { const [y, mm] = m.split('-'); return +y * 12 + (+mm - 1); };
const lab = (m) => { const [y, mm] = m.split('-'); return MES[+mm - 1] + '-' + y.slice(2); };
const fmt = (v) => D.fmt === 'miles' ? v.toLocaleString('es-AR') : (D.pct && v > 0 ? '+' : '') + v.toLocaleString('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }).replace('-', '−') + (D.pct ? '%' : '');
const el = (n, a, p = svg) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };

const all = D.series.flatMap((s) => s.pts);
const t0 = Math.min(...all.map((p) => t(p[0]))), t1 = Math.max(...all.map((p) => t(p[0])));
let lo = Math.min(...all.map((p) => p[1])), hi = Math.max(...all.map((p) => p[1]));
if (D.ref !== undefined) { lo = Math.min(lo, D.ref); hi = Math.max(hi, D.ref); }
const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
const X = (m) => M.l + (t(m) - t0) / (t1 - t0) * (W - M.l - M.r);
const Y = (v) => H - M.b - (v - lo) / (hi - lo) * (H - M.t - M.b);

// grilla y ejes
const step = (() => { const r = (hi - lo) / 4, p = Math.pow(10, Math.floor(Math.log10(r))); return [1, 2, 2.5, 5, 10].map((k) => k * p).find((s) => s >= r); })();
for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
  el('line', { x1: M.l, x2: W - M.r, y1: Y(v), y2: Y(v), class: 'grid' });
  el('text', { x: M.l - 8, y: Y(v) + 4, 'text-anchor': 'end', class: 'tick' }).textContent = D.fmt === 'miles' ? Math.round(v / 1000) + ' mil' : D.pct ? (v > 0 ? '+' : '') + Math.round(v) + '%' : Math.round(v);
}
['2023-01', '2024-01', '2025-01', '2026-01'].filter((m) => t(m) >= t0).forEach((m) => {
  el('text', { x: X(m), y: H - 8, 'text-anchor': 'middle', class: 'tick' }).textContent = m.slice(0, 4);
});
// devaluación
if (t('2023-12') - t0 >= 3) {
  el('line', { x1: X('2023-12'), x2: X('2023-12'), y1: M.t, y2: H - M.b, stroke: '#d1d5db', 'stroke-dasharray': '3 4' });
  el('text', { x: X('2023-12') + 5, y: M.t + 10, class: 'tick' }).textContent = 'devaluación dic-23';
}
// referencia y sombreado
if (D.ref !== undefined) {
  if (D.shade) D.series.forEach((s) => {
    let d = `M${X(s.pts[0][0])},${Y(D.ref)}`;
    s.pts.forEach((p) => { d += `L${X(p[0])},${Y(Math.min(D.ref, p[1]))}`; });
    d += `L${X(s.pts[s.pts.length - 1][0])},${Y(D.ref)}Z`;
    el('path', { d, fill: D.shadeColor || s.color, opacity: 0.08 });
  });
  el('line', { x1: M.l, x2: W - M.r, y1: Y(D.ref), y2: Y(D.ref), stroke: '#6b7280', 'stroke-dasharray': '5 4' });
  if (D.refLabel) el('text', { x: W - M.r, y: Y(D.ref) - 6, 'text-anchor': 'end', class: 'tick' }).textContent = D.refLabel;
}
// líneas
const ends = [];
const leg = document.getElementById('leg');
D.series.forEach((s) => {
  if (D.series.length > 1) leg.insertAdjacentHTML('beforeend', `<span><i style="background:${s.color}"></i>${s.name}</span>`);
  for (let i = 1; i < s.pts.length; i++) {
    const a = s.pts[i - 1], b = s.pts[i], gap = t(b[0]) - t(a[0]) > 1;
    el('line', { x1: X(a[0]), y1: Y(a[1]), x2: X(b[0]), y2: Y(b[1]), stroke: s.color, 'stroke-width': 2.75, 'stroke-linecap': 'round', 'stroke-dasharray': gap ? '2 6' : '' });
  }
  if (D.dots) s.pts.forEach((p) => el('circle', { cx: X(p[0]), cy: Y(p[1]), r: 3.5, fill: s.color }));
  const l = s.pts[s.pts.length - 1];
  el('circle', { cx: X(l[0]), cy: Y(l[1]), r: 5, fill: s.color, stroke: '#fff', 'stroke-width': 2 });
  ends.push(el('text', { x: X(l[0]) + 9, y: Y(l[1]) + 4, class: 'end', fill: s.color }));
  ends[ends.length - 1].textContent = D.fmt === 'miles' ? (Math.round(l[1] / 100) / 10).toLocaleString('es-AR') + ' mil' : fmt(l[1]);
});
if (ends.length === 2) {
  const [a, b] = ends, ya = +a.getAttribute('y'), yb = +b.getAttribute('y');
  if (Math.abs(ya - yb) < 15) { const mid = (ya + yb) / 2, up = ya <= yb; a.setAttribute('y', up ? mid - 8 : mid + 8); b.setAttribute('y', up ? mid + 8 : mid - 8); }
}
// tooltip
const cross = el('line', { y1: M.t, y2: H - M.b, stroke: '#9ca3af', visibility: 'hidden' });
const months = [...new Set(all.map((p) => p[0]))].sort();
const hit = el('rect', { x: M.l, y: M.t, width: W - M.l - M.r, height: H - M.t - M.b, fill: 'transparent' });
hit.addEventListener('pointermove', (ev) => {
  const r = svg.getBoundingClientRect(), k = r.width / W, px = (ev.clientX - r.left) / k;
  const m = months.reduce((a, b) => Math.abs(X(b) - px) < Math.abs(X(a) - px) ? b : a);
  cross.setAttribute('x1', X(m)); cross.setAttribute('x2', X(m)); cross.setAttribute('visibility', 'visible');
  tip.innerHTML = `<b>${lab(m)}</b>` + D.series.map((s) => { const p = s.pts.find((q) => q[0] === m); return p ? `${s.name}: ${fmt(p[1])}` : ''; }).filter(Boolean).join('<br>');
  tip.style.display = 'block';
  let left = X(m) * k + 12; if (left + tip.offsetWidth > r.width) left = X(m) * k - tip.offsetWidth - 12;
  tip.style.left = left + 'px'; tip.style.top = '8px';
});
hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); });
</script>
</body>
</html>
